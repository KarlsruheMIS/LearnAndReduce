<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#0f1328"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern for depth -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="600" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="480" x2="600" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="560" x2="600" y2="560" stroke="#ffffff" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#ffffff" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- ============================================================ -->
  <!-- LEFT SIDE: Graph with IS computation and GNN-guided reduction -->
  <!-- ============================================================ -->

  <!-- Node positions:
    IS nodes (green):      A(140,160), B(340,120), C(120,440), D(480,400)
    Non-IS nodes (gray):   E(260,280), F(420,220), G(80,290)
    Reduced nodes (ghost): H(350,500), I(500,180), J(200,80), K(460,560)
  -->

  <!-- === Edges === -->
  <!-- Edges to/from IS nodes -->
  <line x1="140" y1="160" x2="260" y2="280" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="140" y1="160" x2="200" y2="80" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="140" y1="160" x2="80" y2="290" stroke="#4a5568" stroke-width="2" opacity="0.4"/>

  <line x1="340" y1="120" x2="260" y2="280" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="340" y1="120" x2="420" y2="220" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="340" y1="120" x2="500" y2="180" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="340" y1="120" x2="200" y2="80" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>

  <line x1="120" y1="440" x2="260" y2="280" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="440" x2="80" y2="290" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="440" x2="350" y2="500" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>

  <line x1="480" y1="400" x2="420" y2="220" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="480" y1="400" x2="350" y2="500" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="480" y1="400" x2="460" y2="560" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="480" y1="400" x2="500" y2="180" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>

  <!-- Edges between non-IS nodes -->
  <line x1="260" y1="280" x2="420" y2="220" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="260" y1="280" x2="80" y2="290" stroke="#4a5568" stroke-width="2" opacity="0.4"/>
  <line x1="420" y1="220" x2="500" y2="180" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>

  <!-- Edges between reduced nodes -->
  <line x1="350" y1="500" x2="460" y2="560" stroke="#4a5568" stroke-width="1.5" opacity="0.15" stroke-dasharray="6,4"/>
  <line x1="500" y1="180" x2="200" y2="80" stroke="#4a5568" stroke-width="1.5" opacity="0.15" stroke-dasharray="6,4"/>

  <!-- Extra edges for denser graph -->
  <line x1="260" y1="280" x2="350" y2="500" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>
  <line x1="80" y1="290" x2="200" y2="80" stroke="#4a5568" stroke-width="2" opacity="0.2" stroke-dasharray="6,4"/>

  <!-- === Reduced/ghosted nodes (dashed outline, faded) === -->
  <!-- H(350,500) -->
  <circle cx="350" cy="500" r="22" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>
  <line x1="341" y1="491" x2="359" y2="509" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="359" y1="491" x2="341" y2="509" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- I(500,180) -->
  <circle cx="500" cy="180" r="22" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>
  <line x1="491" y1="171" x2="509" y2="189" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="509" y1="171" x2="491" y2="189" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- J(200,80) -->
  <circle cx="200" cy="80" r="22" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>
  <line x1="191" y1="71" x2="209" y2="89" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="209" y1="71" x2="191" y2="89" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- K(460,560) -->
  <circle cx="460" cy="560" r="22" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="5,4" opacity="0.45"/>
  <line x1="451" y1="551" x2="469" y2="569" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="469" y1="551" x2="451" y2="569" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- === Non-IS nodes (dark gray, solid) with X marks === -->
  <!-- E(260,280) -->
  <circle cx="260" cy="280" r="22" fill="#2a3040" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="251" y1="271" x2="269" y2="289" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="269" y1="271" x2="251" y2="289" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- F(420,220) -->
  <circle cx="420" cy="220" r="22" fill="#2a3040" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="411" y1="211" x2="429" y2="229" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="429" y1="211" x2="411" y2="229" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- G(80,290) -->
  <circle cx="80" cy="290" r="22" fill="#2a3040" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="71" y1="281" x2="89" y2="299" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="89" y1="281" x2="71" y2="299" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === IS nodes (green, glowing) with white checkmarks === -->
  <!-- A(140,160) -->
  <circle cx="140" cy="160" r="24" fill="#059669" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
  <polyline points="129,160 137,168 151,152" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- B(340,120) -->
  <circle cx="340" cy="120" r="24" fill="#059669" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
  <polyline points="329,120 337,128 351,112" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- C(120,440) -->
  <circle cx="120" cy="440" r="24" fill="#059669" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
  <polyline points="109,440 117,448 131,432" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- D(480,400) -->
  <circle cx="480" cy="400" r="24" fill="#059669" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
  <polyline points="469,400 477,408 491,392" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- GNN arrow/annotation: curved arrow from a "brain" icon area pointing to the reduced nodes -->
  <!-- Small neural network icon near top-center of graph area -->
  <g transform="translate(310, 310)" opacity="0.55">
    <!-- Neural net layers -->
    <circle cx="0" cy="-18" r="4" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="18" r="4" fill="#60a5fa" opacity="0.7"/>
    <circle cx="28" cy="-10" r="4" fill="#a78bfa" opacity="0.7"/>
    <circle cx="28" cy="10" r="4" fill="#a78bfa" opacity="0.7"/>
    <circle cx="56" cy="0" r="4" fill="#34d399" opacity="0.7"/>
    <!-- connections -->
    <line x1="4" y1="-18" x2="24" y2="-10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="-18" x2="24" y2="10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="0" x2="24" y2="-10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="0" x2="24" y2="10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="18" x2="24" y2="-10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="4" y1="18" x2="24" y2="10" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="-10" x2="52" y2="0" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <line x1="32" y1="10" x2="52" y2="0" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
    <text x="28" y="35" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" opacity="0.8">GNN</text>
  </g>

  <!-- Divider line -->
  <line x1="600" y1="80" x2="600" y2="560" stroke="#2a3553" stroke-width="1.5" opacity="0.5"/>

  <!-- ============================================================ -->
  <!-- RIGHT SIDE: Text content                                      -->
  <!-- ============================================================ -->

  <!-- Title -->
  <text x="940" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">
    <tspan fill="#60a5fa" filter="url(#glow-text)">Learn</tspan><tspan fill="#94a3b8">And</tspan><tspan fill="#34d399" filter="url(#glow-text)">Reduce</tspan>
  </text>

  <!-- Subtitle -->
  <text x="940" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="400">
    GNN-Guided Preprocessing for MWIS
  </text>

  <!-- Tagline -->
  <text x="940" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-style="italic">
    Neural network guided reduction rules for the
  </text>
  <text x="940" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-style="italic">
    maximum weight independent set problem
  </text>

  <!-- Badge: Part of KarlsruheMIS -->
  <rect x="845" y="345" width="190" height="32" rx="16" ry="16" fill="none" stroke="#4a5568" stroke-width="1.5" opacity="0.7"/>
  <text x="940" y="366" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="500">
    Part of KarlsruheMIS
  </text>

  <!-- Legend -->
  <g transform="translate(780, 430)">
    <!-- IS vertex -->
    <circle cx="18" cy="0" r="10" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <polyline points="12,0 16,4 24,-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="38" y="5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8">IS vertex</text>

    <!-- Excluded -->
    <circle cx="178" cy="0" r="10" fill="#2a3040" stroke="#4a5568" stroke-width="2"/>
    <line x1="172" y1="-6" x2="184" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="184" y1="-6" x2="172" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <text x="198" y="5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8">Excluded</text>

    <!-- Reduced -->
    <circle cx="18" cy="42" r="10" fill="none" stroke="#546e7a" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="12" y1="36" x2="24" y2="48" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="24" y1="36" x2="12" y2="48" stroke="#546e7a" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text x="38" y="47" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8">Reduced (GNN)</text>
  </g>

  <!-- Decorative: small dots pattern on far right -->
  <g opacity="0.08">
    <circle cx="1200" cy="100" r="2" fill="#60a5fa"/>
    <circle cx="1220" cy="120" r="2" fill="#60a5fa"/>
    <circle cx="1240" cy="100" r="2" fill="#60a5fa"/>
    <circle cx="1200" cy="140" r="2" fill="#60a5fa"/>
    <circle cx="1220" cy="160" r="2" fill="#60a5fa"/>
    <circle cx="1240" cy="140" r="2" fill="#60a5fa"/>
    <circle cx="1200" cy="500" r="2" fill="#34d399"/>
    <circle cx="1220" cy="520" r="2" fill="#34d399"/>
    <circle cx="1240" cy="500" r="2" fill="#34d399"/>
    <circle cx="1200" cy="540" r="2" fill="#34d399"/>
    <circle cx="1220" cy="560" r="2" fill="#34d399"/>
    <circle cx="1240" cy="540" r="2" fill="#34d399"/>
  </g>
</svg>
